<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daftar Akun — Snap Studio Photobooth</title>
    <link rel="stylesheet" href="../static/css/styles.css">
</head>
<body class="auth-body">
    <main class="auth-container">
        <div class="auth-card">
            <header class="auth-header">
                <a class="brand" href="/" aria-label="Snap Studio home">
                    <span class="brand-mark">S</span>
                    <span>Snap Studio</span>
                </a>
                <h1>Daftar Akun</h1>
                <p>Buat akun untuk galeri foto pribadi Anda.</p>
            </header>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="auth-alerts">
                        {% for category, message in messages %}
                            <div class="alert alert-{{ category }}" role="alert">
                                {{ message }}
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}

            <form class="auth-form" method="POST" action="/register">
                <div class="form-group">
                    <label for="display_name">Nama Lengkap / Panggilan (Opsional)</label>
                    <input type="text" id="display_name" name="display_name" autocomplete="name" placeholder="Contoh: Nadif Ahmad">
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username" placeholder="Minimal 3 karakter (huruf/angka/_)">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required autocomplete="new-password" placeholder="Minimal 6 karakter">
                </div>

                <div class="form-group">
                    <label for="password_confirm">Konfirmasi Password</label>
                    <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password" placeholder="Ulangi password di atas">
                </div>

                <button class="primary-button auth-submit" type="submit">
                    <span>Buat Akun</span><span aria-hidden="true">→</span>
                </button>
            </form>

            <footer class="auth-footer">
                <p>Sudah punya akun? <a href="/login">Masuk di sini</a></p>
            </footer>
        </div>
    </main>
</body>
</html>
